<!doctype html>
<!--
  GitHub Pages (mermaid-js.github.io/zenuml-core) only sends visitors to
  core.zenuml.com, which runs the latest @zenuml/core release. Deployed by
  .github/workflows/pages-redirect.yml. 404.html is the same page, so old deep
  links redirect too.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@zenuml/core has moved to core.zenuml.com</title>
    <link rel="canonical" href="https://core.zenuml.com/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://core.zenuml.com/" />
    <script>
      location.replace("https://core.zenuml.com/");
    </script>
    <style>
      body {
        margin: 0;
        padding: 48px 16px;
        background: #fafaf9;
        color: #1c1917;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      a {
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <p>
      The @zenuml/core demo has moved to
      <a href="https://core.zenuml.com/">core.zenuml.com</a>.
    </p>
  </body>
</html>
