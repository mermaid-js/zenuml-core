<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->
    <!-- <link
      rel="preload stylesheet"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    /> -->
    <style id="zenumlstyle">
      /* Custom styles for the diagram */
    </style>
    <link
      rel="stylesheet"
      href="/vendor/highlightjs/github-dark.min.css"
    />
    <script src="/vendor/codemirror/codemirror.min.js"></script>
    <link
      rel="stylesheet"
      href="/vendor/codemirror/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="/vendor/codemirror/material-darker.min.css"
    />
    <title>ZenUML Dev Workbench</title>
    <link rel="stylesheet" href="/workbench.css" />
    <script src="/vendor/tailwindcss/tailwindcss.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="toolbar">
        <strong class="product-name">ZenUML</strong>
        <span class="saved-state" role="status" aria-label="Saving…" title="Saving…"></span>
        <div class="view-tabs" role="group" aria-label="Preview mode">
          <button id="view-svg" class="tool-chip">SVG</button>
          <button id="view-dom" class="tool-chip">DOM</button>
          <button id="view-split" class="tool-chip">Split</button>
        </div>
        <button class="tool-chip menu-button" type="button" popovertarget="overflow-menu" aria-label="More tools">⋯</button>
        <div id="overflow-menu" class="overflow-menu" popover>
          <button class="menu-row" type="button" data-closes-menu onclick="loadExample('basic')">Basic sample<span class="menu-hint" aria-hidden="true">Load</span></button>
          <button class="menu-row" type="button" data-closes-menu onclick="loadExample('advanced')">Advanced sample<span class="menu-hint" aria-hidden="true">Load</span></button>
          <button class="menu-row" type="button" data-closes-menu onclick="clearEditor()">Clear editor<span class="menu-hint" aria-hidden="true">Clear</span></button>
          <a class="menu-row" href="/e2e/tools/compare.html" target="_blank" rel="noreferrer">Compare Cases<span class="menu-hint" aria-hidden="true">↗</span></a>
          <a class="menu-row" href="/e2e/tools/svg-preview.html" target="_blank" rel="noreferrer">SVG Only<span class="menu-hint" aria-hidden="true">↗</span></a>
          <button class="menu-row" type="button" data-closes-menu onclick="exportDiagram()">Export PNG<span class="menu-hint" aria-hidden="true">↓</span></button>
          <button class="menu-row capability-switch" type="button" role="switch" data-flag="enableParticipantInsertion">Insert participant<span class="switch-track" aria-hidden="true"></span></button>
          <button class="menu-row capability-switch" type="button" role="switch" data-flag="enableMessageInsertion">Insert message<span class="switch-track" aria-hidden="true"></span></button>
          <button class="menu-row capability-switch" type="button" role="switch" data-flag="enableDividerInsertion">Insert divider<span class="switch-track" aria-hidden="true"></span></button>
          <button class="menu-row capability-switch" type="button" role="switch" data-flag="enableParticipantStyleEditing">Style participant<span class="switch-track" aria-hidden="true"></span></button>
          <button id="width-provider-toggle" class="menu-row" type="button">Text width<span class="menu-hint" aria-hidden="true"></span></button>
        </div>
      </header>

      <main class="workspace mode-svg" id="workspace">
        <article class="panel editor-panel" aria-label="Editor">
          <div class="panel-body editor-body"><textarea id="text" style="display: none"></textarea></div>
        </article>

        <div id="editor-resizer" class="workspace-resizer" role="separator" aria-orientation="vertical" aria-label="Resize editor"></div>

        <article class="panel preview-panel" aria-label="Preview">
          <div class="preview-views">
            <div class="html-panel preview-view">
              <div class="preview-stage html-stage"><div class="fit-box"><div class="fit-content"><pre class="zenuml"></pre></div></div></div>
            </div>
            <div class="svg-panel preview-view">
              <div class="preview-stage svg-stage"><div class="fit-box"><div class="fit-content"><div id="svg-container"></div></div></div></div>
            </div>
          </div>
        </article>
      </main>
      <footer class="diagnostics-footer"><span class="render-indicator" role="status">Waiting</span><span id="svg-stats" class="stats-text">SVG: waiting</span><button id="zoom-toggle" class="zoom-toggle" type="button"></button></footer>
    </div>

    <script type="module">
      import { waitUntil, debounce } from "./src/utils.ts";
      import { toPng } from "html-to-image";
      import { renderToSvg } from "./src/svg/renderToSvg.ts";
      import { ensureDiagramFontsLoaded } from "./src/svg/fonts/ensureDiagramFontsLoaded.ts";
      import { ensureDiagramIconsLoaded } from "./src/svg/icons.ts";
      await ensureDiagramFontsLoaded();

      const editor = CodeMirror.fromTextArea(document.getElementById("text"), {
        lineNumbers: true,
        singleCursorHeightPerLine: false,
        theme: "material-darker",
        mode: "text/plain",
        autofocus: true,
      });

      const svgContainer = document.getElementById("svg-container");
      const svgStats = document.getElementById("svg-stats");
      const workspace = document.getElementById("workspace");
      const editorResizer = document.getElementById("editor-resizer");
      const viewButtons = {
        svg: document.getElementById("view-svg"),
        dom: document.getElementById("view-dom"),
        split: document.getElementById("view-split"),
      };
      const minEditorWidth = 280;
      const minEditorHeight = 80;
      const minPreviewHeight = 160;
      // Top bar + divider + status line, which match the heights in workbench.css.
      const chromeHeight = 64;
      const stackedLayout = window.matchMedia("(max-width: 1024px)");

      function clampEditorWidth(nextWidth) {
        const maxEditorWidth = Math.max(minEditorWidth, window.innerWidth - 412);
        return Math.min(Math.max(nextWidth, minEditorWidth), maxEditorWidth);
      }

      function setEditorWidth(nextWidth) {
        const clampedWidth = clampEditorWidth(nextWidth);
        document.documentElement.style.setProperty("--editor-width", `${clampedWidth}px`);
        localStorage.setItem("zenuml-workbench-editor-width", String(clampedWidth));
      }

      function clampEditorHeight(nextHeight) {
        const maxEditorHeight = Math.max(minEditorHeight, window.innerHeight - chromeHeight - minPreviewHeight);
        return Math.min(Math.max(nextHeight, minEditorHeight), maxEditorHeight);
      }

      function setEditorHeight(nextHeight) {
        const clampedHeight = clampEditorHeight(nextHeight);
        document.documentElement.style.setProperty("--editor-height", `${clampedHeight}px`);
        localStorage.setItem("zenuml-workbench-editor-height", String(clampedHeight));
      }

      function syncResizerOrientation() {
        editorResizer.setAttribute("aria-orientation", stackedLayout.matches ? "horizontal" : "vertical");
      }
      stackedLayout.addEventListener("change", syncResizerOrientation);
      syncResizerOrientation();

      const zoomToggle = document.getElementById("zoom-toggle");
      const previewViews = [...document.querySelectorAll(".preview-view")];
      const stagePadding = 16;
      let zoomMode = localStorage.getItem("zenuml-workbench-zoom") === "actual" ? "actual" : "fit";

      // Scale a wrapper, never pre.zenuml or the svg: PNG export clones those with
      // their computed style. Width only, because sequence diagrams scroll down.
      // Split view uses one scale so both renderings stay comparable.
      function applyZoom() {
        const shown = previewViews.filter((view) => view.clientWidth > 0);
        let scale = 1;
        if (zoomMode === "fit") {
          shown.forEach((view) => {
            const naturalWidth = view.querySelector(".fit-content").offsetWidth;
            if (naturalWidth) scale = Math.min(scale, (view.clientWidth - stagePadding) / naturalWidth);
          });
        }
        shown.forEach((view) => {
          const content = view.querySelector(".fit-content");
          const box = view.querySelector(".fit-box");
          content.style.transform = scale < 1 ? `scale(${scale})` : "";
          box.style.width = `${content.offsetWidth * scale}px`;
          box.style.height = `${content.offsetHeight * scale}px`;
        });
        const percent = `${Math.round(scale * 100)}%`;
        zoomToggle.textContent = zoomMode === "fit" ? `Fit ${percent}` : "100%";
        zoomToggle.setAttribute("aria-label", `Zoom ${zoomToggle.textContent}`);
        zoomToggle.title = zoomMode === "fit" ? "Show at actual size" : "Fit to panel width";
      }

      zoomToggle.addEventListener("click", () => {
        zoomMode = zoomMode === "fit" ? "actual" : "fit";
        localStorage.setItem("zenuml-workbench-zoom", zoomMode);
        applyZoom();
      });

      const zoomObserver = new ResizeObserver(applyZoom);
      zoomObserver.observe(document.querySelector(".preview-panel"));
      document.querySelectorAll(".fit-content").forEach((content) => zoomObserver.observe(content));

      new ResizeObserver(() => editor.refresh()).observe(document.querySelector(".editor-body"));

      const overflowMenu = document.getElementById("overflow-menu");
      overflowMenu.querySelectorAll("[data-closes-menu]").forEach((item) => {
        item.addEventListener("click", () => overflowMenu.hidePopover());
      });

      function setSavedState(message, failed = false) {
        const savedState = document.querySelector(".saved-state");
        savedState.setAttribute("aria-label", message);
        savedState.title = message;
        savedState.classList.toggle("is-failed", failed);
        savedState.textContent = failed ? "Not saved" : "";
      }

      function setViewMode(mode) {
        const validMode = ["svg", "dom", "split"].includes(mode) ? mode : "svg";
        workspace.classList.remove("mode-svg", "mode-dom", "mode-split");
        workspace.classList.add(`mode-${validMode}`);

        Object.entries(viewButtons).forEach(([key, button]) => {
          button.classList.toggle("is-active", key === validMode);
          button.setAttribute("aria-pressed", String(key === validMode));
        });

        localStorage.setItem("zenuml-workbench-view", validMode);
        applyZoom();
      }

      const FLAG_KEYS = [
        "enableParticipantInsertion",
        "enableMessageInsertion",
        "enableDividerInsertion",
        "enableParticipantStyleEditing",
      ];
      const FLAG_STORAGE_PREFIX = "zenuml-workbench-flag-";

      function readFlag(key) {
        const stored = localStorage.getItem(FLAG_STORAGE_PREFIX + key);
        // Default ON in the workbench so dev experience matches main.tsx.
        return stored === null ? true : stored === "true";
      }

      function writeFlag(key, value) {
        localStorage.setItem(FLAG_STORAGE_PREFIX + key, String(value));
      }

      function readFlags() {
        return Object.fromEntries(FLAG_KEYS.map((k) => [k, readFlag(k)]));
      }

      function syncFlagButtons() {
        document.querySelectorAll("[data-flag]").forEach((btn) => {
          const enabled = readFlag(btn.dataset.flag);
          btn.classList.toggle("is-active", enabled);
          btn.setAttribute("aria-checked", String(enabled));
        });
      }

      const updateHtmlPreview = debounce((content) => {
        // main.tsx merges the demo config (theme, editing flags) into every render.
        window.zenUml.render(content, {
          ...readFlags(),
          onContentChange: (code) => editor.setValue(code),
        });
      }, 400);

      document.querySelectorAll("[data-flag]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.flag;
          writeFlag(key, !readFlag(key));
          syncFlagButtons();
          updateHtmlPreview(editor.getValue());
        });
      });
      syncFlagButtons();

      let svgPreviewSeq = 0;
      const updateSvgPreview = debounce(async (content) => {
        const seq = ++svgPreviewSeq;
        await ensureDiagramIconsLoaded(content);
        if (seq !== svgPreviewSeq) return; // a newer edit is rendering
        try {
          const t0 = performance.now();
          const result = renderToSvg(content);
          const dt = (performance.now() - t0).toFixed(1);

          if (!result.svg || result.width === 0 || result.height === 0) {
            svgContainer.innerHTML = `
              <div class="svg-error">
                Native SVG output is empty for the current input.
              </div>
            `;
            svgStats.textContent = "SVG: empty";
            document.querySelector(".render-indicator").textContent = "Empty";
            return;
          }

          svgContainer.innerHTML = result.svg;
          svgStats.textContent = `· ${result.width} × ${result.height} · ${dt} ms`;
          document.querySelector(".render-indicator").textContent = "Rendered";
        } catch (error) {
          console.error("Failed to render native SVG preview:", error);
          svgContainer.innerHTML = `
            <div class="svg-error">
              Native SVG preview failed. Check the console for details.
            </div>
          `;
          svgStats.textContent = "SVG: error";
          document.querySelector(".render-indicator").textContent = "Render failed";
        }
      }, 180);

      Object.entries(viewButtons).forEach(([mode, button]) => {
        button.addEventListener("click", () => setViewMode(mode));
      });

      editorResizer.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        workspace.classList.add("is-resizing");
        editorResizer.setPointerCapture(event.pointerId);

        const onPointerMove = (moveEvent) => {
          const origin = workspace.getBoundingClientRect();
          if (stackedLayout.matches) {
            setEditorHeight(moveEvent.clientY - origin.top);
          } else {
            setEditorWidth(moveEvent.clientX - origin.left);
          }
        };

        const stopResize = () => {
          workspace.classList.remove("is-resizing");
          editorResizer.removeEventListener("pointermove", onPointerMove);
          editorResizer.removeEventListener("pointerup", stopResize);
          editorResizer.removeEventListener("pointercancel", stopResize);
        };

        editorResizer.addEventListener("pointermove", onPointerMove);
        editorResizer.addEventListener("pointerup", stopResize);
        editorResizer.addEventListener("pointercancel", stopResize);
      });

      window.addEventListener("resize", () => {
        const savedWidth = Number(localStorage.getItem("zenuml-workbench-editor-width"));
        if (savedWidth) {
          setEditorWidth(savedWidth);
        }
        const savedHeight = Number(localStorage.getItem("zenuml-workbench-editor-height"));
        if (savedHeight) {
          setEditorHeight(savedHeight);
        }
      });

      editor.on("change", function (cm) {
        const content = cm.getValue();
        updateSvgPreview(content);

        waitUntil(
          () => window.zenUml,
          () => {
            updateHtmlPreview(content);
            // Save to localStorage
            try {
              localStorage.setItem("zenuml-cm-code", content);
              setSavedState("Saved locally in this browser");
            } catch {
              setSavedState("Could not save in this browser", true);
            }
          },
        );
      });

      // Example data
      const examples = {
        basic: `Alice -> Bob: Hello Bob!
Bob -> Alice: Hello Alice!`,
        advanced: `title Online Shopping
participant Customer
participant WebApp
participant PaymentService
participant Database

Customer -> WebApp: Browse products
WebApp -> Database: Query products
Database --> WebApp: Return products
WebApp --> Customer: Display products

Customer -> WebApp: Add to cart
WebApp -> Database: Update cart
Database --> WebApp: Cart updated
WebApp --> Customer: Show cart

Customer -> WebApp: Checkout
WebApp -> PaymentService: Process payment
PaymentService --> WebApp: Payment confirmed
WebApp -> Database: Create order
Database --> WebApp: Order created
WebApp --> Customer: Order confirmation`,
      };

      // Global functions
      window.loadExample = function (type) {
        editor.setValue(examples[type] || examples.basic);
      };

      window.clearEditor = function () {
        editor.setValue("");
      };

      window.exportDiagram = async function () {
        const element = workspace.classList.contains("mode-svg")
          ? svgContainer.querySelector("svg")
          : document.querySelector(".zenuml");
        if (element) {
          try {
            const dataUrl = await toPng(element);
            const link = document.createElement("a");
            link.download = "sequence-diagram.png";
            link.href = dataUrl;
            link.click();
          } catch (error) {
            console.error("Failed to export diagram:", error);
          }
        }
      };

      // Load saved code from localStorage or default example
      const savedCode = localStorage.getItem("zenuml-cm-code");
      if (savedCode) {
        editor.setValue(savedCode);
      } else {
        editor.setValue(examples.basic);
      }

      const savedEditorWidth = Number(localStorage.getItem("zenuml-workbench-editor-width"));
      if (savedEditorWidth) {
        setEditorWidth(savedEditorWidth);
      }

      const savedEditorHeight = Number(localStorage.getItem("zenuml-workbench-editor-height"));
      if (savedEditorHeight) {
        setEditorHeight(savedEditorHeight);
      }

      setViewMode(localStorage.getItem("zenuml-workbench-view") || "svg");
    </script>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const wp = params.get("WIDTH_PROVIDER") || import.meta.env.VITE_WIDTH_PROVIDER || "browser";
      const toggle = document.getElementById("width-provider-toggle");
      const isCanvas = wp === "canvas";
      toggle.querySelector(".menu-hint").textContent = isCanvas ? "Canvas" : "Browser";
      toggle.title = "Click to switch to " + (isCanvas ? "browser" : "canvas");
      toggle.addEventListener("click", () => {
        const next = isCanvas ? "browser" : "canvas";
        params.set("WIDTH_PROVIDER", next);
        location.search = params.toString();
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
