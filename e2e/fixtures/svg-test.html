<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SVG Parity Test</title>
    <style>
      body { margin: 0; background: white; }
    </style>
  </head>
  <body>
    <div id="svg-output"></div>
    <script type="module">
      import { renderToSvg } from "/src/svg/renderToSvg.ts";
      import { ensureDiagramFontsLoaded } from "/src/svg/fonts/ensureDiagramFontsLoaded.ts";
      import { ensureDiagramIconsLoaded } from "/src/svg/icons.ts";
      // theme is optional; the audit script passes it to render theme-dark.
      window.__renderSvg = async (code, theme) => {
        await ensureDiagramFontsLoaded();
        await ensureDiagramIconsLoaded(code);
        const result = renderToSvg(code, theme ? { theme } : undefined);
        document.getElementById("svg-output").innerHTML = result.svg;
      };
    </script>
  </body>
</html>
