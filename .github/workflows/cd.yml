# Simple workflow for deploying static content to GitHub Pages
name: Build, Test, npm Publish, and Deploy

on:
  push:
    # main only. A push to a PR branch used to start two runs of this
    # workflow (push + pull_request). With 16 e2e shards that is
    # 2 x (16 + test + docker) = 36 jobs at once, past GitHub's concurrent-job
    # limit, so shards would queue and sharding would buy nothing. Branches
    # now run once, through pull_request.
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "Integration/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "Integration/**"
      - "*.md"

# One run per ref at a time. A newer push to a PR branch cancels the older run;
# pushes to main never cancel (every main run must publish and deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Test
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        # tsc -b (project references), not bare `tsc --noEmit` — the root
        # tsconfig.json has "files": [] so a bare `tsc --noEmit` checks zero
        # files and always exits 0. `-b` builds tsconfig.app.json (src) and
        # tsconfig.node.json (vite.config.ts), which is the real check.
        run: bun run typecheck
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-browsers-
      # Browser binary only, no `playwright install-deps`. That apt step cost
      # 46 s on every run (154 packages, 88 MB; run 38886329048, 2026-10-16)
      # and was added in #394 for CLI PNG snapshots that no longer exist:
      # src/cli/zenuml.spec.ts now checks the PNG header bytes and the
      # scale-3 width ratio, and the CLI registers its own IBM Plex Sans for
      # @napi-rs/canvas measurement. Chromium's shared libraries are already
      # on the ubuntu-22.04 runner image.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: Lint
        run: bunx eslint src
      - name: Run tests
        run: bun run test
      - name: Parser consistency gate (ANTLR vs Langium side-car)
        # The published library ships the ANTLR parser; the Langium parser
        # (src/parser-langium/) is a side-car used to generate the LSP server.
        # This diffs both engines over the whole corpus and fails on any
        # undocumented divergence, so the two parsers can never drift apart.
        run: bun run parity:dualrun
      - name: Build LSP server (side-car, ensure it compiles)
        run: bun run build:lsp

  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  # Smoke-test the Dockerfile: it has no other coverage, so a package-manager
  # or script drift (e.g. package.json's build:site renamed) goes unnoticed
  # until someone tries to build the image.
  docker-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  # Release via Changesets.
  #
  # On every push to main this job runs the changesets action:
  #   * If unreleased changeset files exist in .changeset/, it opens (or
  #     updates) a "Version Packages" PR that bumps package.json and writes
  #     CHANGELOG.md.
  #   * When that PR is merged (no changesets left), it runs `bun run release`
  #     which builds and publishes to npm, then tags the commit and creates a
  #     GitHub Release.
  #
  # Bump levels are declared per-PR by contributors via `bun run changeset`,
  # so versioning no longer depends on parsing commit messages.
  release:
    runs-on: ubuntu-22.04
    needs: [test, e2e]
    permissions:
      contents: write # commit version bump, push tags, create releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm OIDC trusted publishing + provenance
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # changesets needs full history and tags
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - name: Create Release PR or Publish to npm
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true" # publish with provenance via OIDC

  # Build the site while test and e2e run, so deploy only has to upload it.
  # Before this job existed, deploy reinstalled and rebuilt after the gates
  # passed: 10 s setup + 3 s install + 30 s build + 7 s wrangler = 51 s on the
  # critical path of every run (run 38886329048, 2026-10-16).
  build-site:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install dependencies
        run: bun install
      - name: Build site
        run: bun run build:site
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Deploy to Cloudflare Workers
  deploy-to-cloudflare:
    runs-on: ubuntu-22.04
    needs: [test, e2e, build-site]
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        # wrangler.toml only; the site itself comes from the build-site artifact.
        uses: actions/checkout@v6
      - name: Setup Bun
        # wrangler-action picks the package manager from the lockfile and
        # installs wrangler with bun; without bun on PATH it fails.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Download site
        uses: actions/download-artifact@v7
        with:
          name: site-dist
          path: dist/

      - name: Deploy to Cloudflare Workers (Production)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      - name: Deploy to Cloudflare Workers (Staging)
        id: deploy_staging # Add an ID to reference this step
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

      - name: Comment on PR with Staging URL
        if: github.event_name == 'pull_request' && github.ref != 'refs/heads/main' && steps.deploy_staging.outputs.deployment-url != ''
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Staging deployment available at: ${{ steps.deploy_staging.outputs.deployment-url }}
