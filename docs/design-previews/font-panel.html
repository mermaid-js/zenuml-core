<!doctype html>
<meta charset="utf-8">
<title>font panel</title>
<style>body{font-family:system-ui;margin:16px;background:#fff;color:#222}h2{font-size:16px}p{font:12px ui-monospace,monospace;color:#555}</style>
<h2 id="h"></h2><div id="out"></div><p id="info"></p>
<script type="module">
const FONTS = {
  plex: ["IBM Plex Sans", "https://fonts.gstatic.com/s/ibmplexsans/v23/zYXGKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1swZSAXcomDVmadSD6llDB6g4tIOm6_De.woff2"],
  inter: ["Inter", "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2"],
  recursive: ["Recursive Sans Linear", "https://fonts.gstatic.com/s/recursive/v44/8vJN7wMr0mhh-RQChyHEH06TlXhq_gukbYrFMk1QuAIcyEwG_X-dpEfaE5YaERmK-CImKsvxvU-MXGX2fSqasNfUvz2xbXfn1uEQadCCk317tQ1BCYCK6v8.woff2"],
};
const sel = FONTS[new URLSearchParams(location.search).get("font")];
const plex = !!sel;
if (sel) {
  // Preview-only: alias the library's hard-coded "Helvetica" to the candidate font so
  // both text measurement and rendering use it without touching library code.
  const face = new FontFace("Helvetica", `url(${sel[1]})`, { weight: "400" });
  document.fonts.add(await face.load());
  await document.fonts.load('15px "Helvetica"');
}
const { renderToSvg } = await import("/src/svg/renderToSvg.ts");
const { buildThemeStyles, THEME_PALETTES } = await import("/src/svg/themes.ts");
const code = `title Order Checkout
@Actor Customer
@Boundary Web
OrderService
@Database DB
Customer->Web.checkout(cart) {
  // validate and create the order
  order = OrderService.create(cart) {
    if (inStock) {
      DB.save(order)
      return order
    } else {
      @return OrderService->Web: outOfStock
    }
    loop (each item) {
      DB.reserve(item)
    }
  }
  return receipt
}
Web->OrderService.fill(Il1, O0o, rn_m, userId)`;
const p = THEME_PALETTES["theme-default"];
const r = renderToSvg(code);
const css = buildThemeStyles(p);
const anon = new URLSearchParams(location.search).get("label");
document.getElementById("h").textContent = anon ? anon : sel ? sel[0] : "Helvetica（当前字体）";
document.getElementById("out").innerHTML = r.svg.replace(/<style>[\s\S]*?<\/style>/, `<style>${css}</style>`);
const c = document.createElement("canvas").getContext("2d"); c.font = '15px Helvetica, Verdana, serif';
document.getElementById("info").textContent = `diagram ${Math.round(r.width)}×${Math.round(r.height)} · "create(cart)" = ${c.measureText("create(cart)").width.toFixed(1)}px`;
window.__info = { w: r.width, h: r.height, plexLoaded: plex ? document.fonts.check('15px "Helvetica"') : null };
window.__done = true;
</script>
